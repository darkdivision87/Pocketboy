<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Robot Smash Lab">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2b2a6e">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<title>Robot Smash Lab</title>
<style>
:root{
  --ink:#2a2260; --card:#fffaf2; --blue:#3ea8ff; --blued:#1c63c4; --pink:#ff5d9e; --pinkd:#c93179; --yellow:#ffd23f; --yellowd:#d99a0b; --green:#4cd68d; --greend:#1f9d5f; --purple:#9a6bff; --purpled:#5f37cf; --orange:#ff8a3c; --oranged:#c75a12;
  --sb:env(safe-area-inset-bottom,0px); --st:env(safe-area-inset-top,0px); --sl:env(safe-area-inset-left,0px); --sr:env(safe-area-inset-right,0px);
  --font:ui-rounded,"SF Pro Rounded","Nunito","Varela Round",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#2b2a6e;font-family:var(--font);color:var(--ink);overscroll-behavior:none;touch-action:none;position:fixed;inset:0;width:100%}
#app{position:fixed;inset:0;height:100dvh;overflow:hidden}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font-family:inherit;border:0;cursor:pointer;touch-action:manipulation;color:inherit;padding:0}
svg{display:block}
.hidden{display:none!important}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:64px;padding:0 30px;border-radius:24px;font-size:24px;font-weight:900;letter-spacing:.3px;color:#fff;background:var(--blue);box-shadow:0 7px 0 var(--blued),0 14px 24px rgba(20,10,80,.35);text-shadow:0 2px 0 rgba(0,0,0,.22);transition:transform .08s,box-shadow .08s;position:relative}
.btn:active{transform:translateY(5px);box-shadow:0 2px 0 var(--blued),0 6px 12px rgba(20,10,80,.3)}
.btn.pink{background:var(--pink);box-shadow:0 7px 0 var(--pinkd),0 14px 24px rgba(20,10,80,.35)}.btn.pink:active{box-shadow:0 2px 0 var(--pinkd)}
.btn.green{background:var(--green);box-shadow:0 7px 0 var(--greend),0 14px 24px rgba(20,10,80,.35)}.btn.green:active{box-shadow:0 2px 0 var(--greend)}
.btn.yellow{background:var(--yellow);color:#6b4300;text-shadow:0 2px 0 rgba(255,255,255,.4);box-shadow:0 7px 0 var(--yellowd),0 14px 24px rgba(20,10,80,.35)}.btn.yellow:active{box-shadow:0 2px 0 var(--yellowd)}
.btn.purple{background:var(--purple);box-shadow:0 7px 0 var(--purpled),0 14px 24px rgba(20,10,80,.35)}.btn.purple:active{box-shadow:0 2px 0 var(--purpled)}
.btn.orange{background:var(--orange);box-shadow:0 7px 0 var(--oranged),0 14px 24px rgba(20,10,80,.35)}.btn.orange:active{box-shadow:0 2px 0 var(--oranged)}
.btn.big{min-height:84px;font-size:34px;padding:0 54px;border-radius:30px}
.btn.small{min-height:56px;font-size:20px;padding:0 22px;border-radius:20px}
.btn svg{width:30px;height:30px}
.ib{width:60px;height:60px;border-radius:20px;background:rgba(30,20,90,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 4px 0 rgba(0,0,0,.28),inset 0 0 0 2px rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;padding:13px;pointer-events:auto;position:relative}
.ib:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.28),inset 0 0 0 2px rgba(255,255,255,.18)}
.ib.on{background:rgba(255,93,158,.9)}
.ib .lbl{position:absolute;bottom:-17px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:800;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6);white-space:nowrap}

/* HUD */
#hud{position:absolute;left:0;right:0;top:0;padding:calc(10px + var(--st)) calc(12px + var(--sr)) 0 calc(12px + var(--sl));display:flex;align-items:flex-start;gap:10px;pointer-events:none;z-index:5}
#hud .sp{flex:1}
.pill{display:flex;align-items:center;gap:8px;height:48px;padding:0 16px 0 8px;border-radius:24px;background:rgba(30,20,90,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#fff;font-weight:900;font-size:22px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.18);pointer-events:auto}
.pill svg{width:32px;height:32px}
.pill.bump{animation:bump .3s}
@keyframes bump{50%{transform:scale(1.18)}}
#goal{position:absolute;left:50%;top:calc(10px + var(--st));transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none;max-width:42vw}
#goal .g1{background:rgba(30,20,90,.78);color:#fff;padding:8px 18px;border-radius:22px;font-size:20px;font-weight:900;text-align:center;box-shadow:inset 0 0 0 2px rgba(255,255,255,.2);white-space:nowrap}
#goal .g2{background:rgba(255,255,255,.88);color:var(--ink);padding:3px 14px;border-radius:14px;font-size:16px;font-weight:900}
#goal .g2.low{background:#ff5d6c;color:#fff;animation:bump .6s infinite}
#shelf{position:absolute;left:0;right:0;bottom:0;padding:8px calc(12px + var(--sr)) calc(10px + var(--sb)) calc(12px + var(--sl));display:flex;gap:10px;justify-content:center;overflow-x:auto;overflow-y:hidden;touch-action:pan-x;z-index:5;background:linear-gradient(to top,rgba(20,10,70,.82),rgba(20,10,70,.55) 75%,rgba(20,10,70,0));scrollbar-width:none;-webkit-overflow-scrolling:touch}
#shelf::-webkit-scrollbar{display:none}
.tool{flex:0 0 auto;width:72px;height:80px;border-radius:20px;background:rgba(255,255,255,.16);box-shadow:inset 0 0 0 2px rgba(255,255,255,.22),0 4px 0 rgba(0,0,0,.25);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#fff;font-size:11.5px;font-weight:900;position:relative;touch-action:manipulation}
.tool svg{width:42px;height:42px}
.tool.sel{background:linear-gradient(#ffe56a,#ffb830);color:#5a3500;box-shadow:inset 0 0 0 3px #fff,0 4px 0 #b47c00,0 0 24px rgba(255,210,63,.8);transform:translateY(-6px)}
.tool.locked svg{filter:grayscale(.9);opacity:.55}
.tool.locked{background:rgba(255,255,255,.08)}
.tool .price{position:absolute;top:-8px;right:-4px;background:var(--yellow);color:#6b4300;border-radius:12px;padding:1px 7px;font-size:12px;font-weight:900;box-shadow:0 2px 0 var(--yellowd)}
.tool .cd{position:absolute;inset:0;border-radius:20px;background:rgba(20,10,70,.62);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900}
@media (max-width:560px){.tool{width:66px;height:74px}.tool svg{width:38px;height:38px}#shelf{justify-content:flex-start}}

/* screens */
.screen{position:absolute;inset:0;z-index:10;display:none;flex-direction:column;align-items:center;justify-content:center;padding:calc(18px + var(--st)) calc(18px + var(--sr)) calc(18px + var(--sb)) calc(18px + var(--sl));text-align:center}
.screen.show{display:flex;animation:fadein .25s}
@keyframes fadein{from{opacity:0}}
.dim{background:radial-gradient(ellipse at center,rgba(30,20,100,.55),rgba(15,10,60,.8))}
.logo{font-size:clamp(46px,9vw,104px);line-height:.92;font-weight:1000;color:#fff;letter-spacing:1px;text-transform:uppercase;-webkit-text-stroke:0;text-shadow:0 5px 0 #ff5d9e,0 10px 0 #7a2fbf,0 16px 0 #2a2260,0 26px 34px rgba(0,0,0,.45);transform:rotate(-3deg);margin:0}
.logo small{display:block;font-size:.52em;color:#ffd23f;text-shadow:0 4px 0 #c75a12,0 8px 0 #2a2260,0 16px 26px rgba(0,0,0,.4);margin-top:.1em}
.sticker{margin-top:30px;background:#fff;color:var(--ink);font-weight:900;font-size:18px;padding:6px 18px;border-radius:18px;transform:rotate(2deg);box-shadow:0 4px 0 rgba(0,0,0,.25)}
.bar{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap}
.top{position:absolute;left:0;right:0;top:0;padding:calc(12px + var(--st)) calc(14px + var(--sr)) 0 calc(14px + var(--sl));display:flex;align-items:center;gap:10px;z-index:2}
.top h2{margin:0;flex:1;text-align:center;color:#fff;font-size:30px;font-weight:1000;text-shadow:0 3px 0 rgba(0,0,0,.3)}
.panel{background:rgba(255,250,242,.97);border-radius:34px;padding:26px 30px;box-shadow:0 10px 0 rgba(0,0,0,.2),0 30px 60px rgba(10,5,60,.5);max-width:min(560px,92vw)}
.panel h2{margin:0 0 6px;font-size:40px;font-weight:1000}
.panel p{margin:6px 0 16px;font-size:20px;font-weight:700;color:#5a4a8a}
.homegrid{display:flex;gap:22px;flex-wrap:wrap;justify-content:center}
.tile{width:min(30vw,250px);min-width:200px;border-radius:34px;padding:22px 14px 20px;color:#fff;font-weight:1000;font-size:28px;display:flex;flex-direction:column;align-items:center;gap:12px;text-shadow:0 2px 0 rgba(0,0,0,.25);position:relative}
.tile svg{width:92px;height:92px;filter:drop-shadow(0 5px 0 rgba(0,0,0,.2))}
.tile small{font-size:16px;font-weight:800;opacity:.92}
.tile:active{transform:translateY(5px)}
.scroll{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-y;width:100%;flex:1;margin-top:calc(76px + var(--st));padding:4px 4px 22px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.arena{background:rgba(255,255,255,.16);border-radius:30px;padding:14px 16px 16px;margin:0 auto 16px;max-width:900px;text-align:left;box-shadow:inset 0 0 0 2px rgba(255,255,255,.2)}
.arena h3{margin:0 0 10px;color:#fff;font-size:26px;font-weight:1000;display:flex;align-items:center;gap:10px;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.arena h3 .pr{margin-left:auto;background:var(--yellow);color:#6b4300;border-radius:16px;padding:5px 14px;font-size:18px;display:flex;gap:6px;align-items:center;text-shadow:none}
.lv{display:flex;gap:12px;flex-wrap:wrap}
.lvb{width:132px;min-height:112px;border-radius:24px;background:#fff;color:var(--ink);font-weight:1000;font-size:30px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 6px 0 rgba(0,0,0,.22);position:relative}
.lvb small{font-size:13px;font-weight:800;color:#6a5a9a;line-height:1.1;padding:0 6px}
.lvb .st{display:flex;gap:2px}.lvb .st svg{width:24px;height:24px}
.lvb:active{transform:translateY(4px)}
.lvb.lk{background:rgba(255,255,255,.45);color:rgba(42,34,96,.55);box-shadow:none}
.lvb.lk .lkI{width:34px;height:34px}
.tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
.tab{min-height:52px;padding:0 20px;border-radius:20px;background:rgba(255,255,255,.2);color:#fff;font-size:19px;font-weight:900;box-shadow:inset 0 0 0 2px rgba(255,255,255,.2)}
.tab.on{background:#fff;color:var(--ink);box-shadow:0 5px 0 rgba(0,0,0,.25)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;max-width:1000px;margin:0 auto}
.card{background:#fffaf2;border-radius:28px;padding:14px 12px 14px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 6px 0 rgba(0,0,0,.2);text-align:center}
.card .pv{width:96px;height:96px;display:flex;align-items:center;justify-content:center}
.card .pv img{max-width:100%;max-height:100%;border-radius:18px}
.card b{font-size:21px;font-weight:1000}.card span{font-size:14px;font-weight:700;color:#6a5a9a;min-height:36px;line-height:1.15}
.card .btn{min-height:50px;font-size:18px;padding:0 18px;border-radius:18px;margin-top:4px;box-shadow:0 5px 0 rgba(0,0,0,.2)}
.card .btn.dis{filter:grayscale(.8);opacity:.6}
.lvlpips{display:flex;gap:4px}.lvlpips i{width:16px;height:10px;border-radius:5px;background:#ddd}.lvlpips i.f{background:var(--green)}
#stars{display:flex;gap:6px;justify-content:center;margin:2px 0 10px}
#stars svg{width:96px;height:96px;transform:scale(0)}
#stars svg.pop{animation:starpop .55s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes starpop{from{transform:scale(0) rotate(-40deg)}to{transform:scale(1) rotate(0)}}
#hintFinger{width:72px;height:72px;margin:6px auto 0;animation:swipe 1.6s infinite ease-in-out}
@keyframes swipe{0%{transform:translate(-50px,16px) rotate(-10deg)}50%{transform:translate(50px,-16px) rotate(10deg)}100%{transform:translate(-50px,16px) rotate(-10deg)}}
#toast{position:absolute;left:50%;bottom:calc(120px + var(--sb));transform:translateX(-50%) translateY(20px);background:rgba(30,20,90,.92);color:#fff;padding:12px 22px;border-radius:22px;font-size:19px;font-weight:900;opacity:0;pointer-events:none;transition:all .25s;z-index:20;text-align:center;max-width:88vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:6}
.corner{position:absolute;right:calc(14px + var(--sr));top:calc(14px + var(--st));z-index:11}
.corner2{position:absolute;left:calc(14px + var(--sl));bottom:calc(14px + var(--sb));z-index:11;color:#fff;font-weight:900;font-size:16px;text-decoration:none;background:rgba(30,20,90,.6);border-radius:18px;padding:12px 18px;min-height:48px;display:flex;align-items:center}
@media (max-height:520px){.logo{font-size:44px}.btn.big{min-height:68px;font-size:28px}.tile{padding:12px}.tile svg{width:60px;height:60px}}
@media (orientation:portrait){.tile{width:min(80vw,380px)}.homegrid{flex-direction:column;gap:16px}.tile{flex-direction:row;justify-content:flex-start;padding:14px 22px;font-size:26px}.tile svg{width:64px;height:64px}.tile small{display:none}#goal{max-width:70vw;top:calc(76px + var(--st))}.logo{font-size:15vw}}
</style>
</head>
<body>
<div id="app">
  <canvas id="c"></canvas>
  <div id="flash"></div>

  <div id="hud" class="hidden">
    <button class="ib" id="bPause" aria-label="Pause"></button>
    <div class="pill" id="coinPill"><span id="coinIc"></span><b id="coinN">0</b></div>
    <div class="sp"></div>
    <button class="ib" id="bScene" aria-label="Change arena"></button>
    <button class="ib" id="bBot" aria-label="Add robot"></button>
    <button class="ib" id="bRebuild" aria-label="Rebuild robots"></button>
  </div>
  <div id="goal" class="hidden"><div class="g1" id="goalTxt"></div><div class="g2" id="goalTime"></div></div>
  <div id="shelf" class="hidden"></div>
  <div id="toast"></div>

  <div class="screen" id="title">
    <h1 class="logo">Robot Smash<small>Lab</small></h1>
    <div class="sticker">Stretch, fling and boing the toy robots!</div>
    <div style="height:34px"></div>
    <button class="btn big yellow" id="bPlay"><span id="playIc" style="width:38px;height:38px"></span>Play</button>
    <button class="ib corner" id="bMuteT" aria-label="Sound"></button>
    <a class="corner2" href="../">&larr; All games</a>
  </div>

  <div class="screen dim" id="home">
    <div class="top"><button class="ib" id="homeBack" aria-label="Back"></button><h2>Robot Smash Lab</h2><div class="pill"><span class="ci"></span><b class="cn">0</b></div></div>
    <div class="homegrid">
      <button class="tile" id="tMissions" style="background:linear-gradient(#ff7ab0,#e0407f);box-shadow:0 8px 0 #9c2658,0 18px 30px rgba(10,5,60,.4)"><span id="tMi"></span>Missions<small>Beat levels, win stars</small></button>
      <button class="tile" id="tSandbox" style="background:linear-gradient(#58c0ff,#2a80e0);box-shadow:0 8px 0 #1a56a0,0 18px 30px rgba(10,5,60,.4)"><span id="tSa"></span>Sandbox<small>Free play, no rules</small></button>
      <button class="tile" id="tShop" style="background:linear-gradient(#ffb04a,#f0791a);box-shadow:0 8px 0 #a8500a,0 18px 30px rgba(10,5,60,.4)"><span id="tSh"></span>Toy Shop<small>Tools, skins, arenas</small></button>
    </div>
  </div>

  <div class="screen dim" id="missions">
    <div class="top"><button class="ib" id="misBack" aria-label="Back"></button><h2>Missions</h2><div class="pill"><span class="ci"></span><b class="cn">0</b></div></div>
    <div class="scroll" id="misList"></div>
  </div>

  <div class="screen dim" id="shop">
    <div class="top"><button class="ib" id="shopBack" aria-label="Back"></button><h2>Toy Shop</h2><div class="pill"><span class="ci"></span><b class="cn">0</b></div></div>
    <div class="scroll"><div class="tabs" id="tabs"></div><div class="cards" id="cards"></div></div>
  </div>

  <div class="screen dim" id="pause">
    <div class="panel">
      <h2>Paused</h2>
      <div class="bar" style="flex-direction:column;gap:16px;margin-top:14px">
        <button class="btn big green" id="pResume"><span class="ic"></span>Resume</button>
        <div class="bar">
          <button class="btn pink" id="pRestart"><span class="ic"></span>Restart</button>
          <button class="btn purple" id="pMute"><span class="ic"></span><span class="tx">Sound</span></button>
        </div>
        <button class="btn orange" id="pHome"><span class="ic"></span>Menu</button>
      </div>
    </div>
  </div>

  <div class="screen dim" id="end">
    <div class="panel">
      <h2 id="endTitle">Great job!</h2>
      <div id="stars"></div>
      <p id="endMsg"></p>
      <div class="bar">
        <button class="btn pink" id="eRetry"><span class="ic"></span>Again</button>
        <button class="btn green" id="eNext"><span class="ic"></span>Next</button>
        <button class="btn orange" id="eHome"><span class="ic"></span>Menu</button>
      </div>
    </div>
  </div>

  <div class="screen" id="hint" style="background:rgba(15,10,60,.45);justify-content:center">
    <div class="panel" style="max-width:min(520px,90vw)">
      <h2 id="hintT">How to play</h2>
      <div id="hintFinger"></div>
      <p id="hintP" style="margin-top:18px"></p>
      <button class="btn big green" id="hintOk">Got it!</button>
    </div>
  </div>
</div>
<script src="../../vendor/matter/matter.min.js"></script>
<script type="module" src="game.js"></script>
</body>
</html>
