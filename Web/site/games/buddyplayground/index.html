<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Buddy Playground">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#ffb3d1">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<title>Buddy Playground</title>
<style>
:root{
  --ink:#4a2a6b; --ink2:#7a5a9a; --pink:#ff5d9e; --pinkd:#d93a7c; --yellow:#ffd23f; --yellowd:#e0a416; --blue:#3ea8ff; --blued:#1f6ec7; --green:#4cd68d; --greend:#22a363; --purple:#9a6bff; --purpled:#6a3fd4;
  --card:#fffaf2; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px); --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
  --font:ui-rounded,"SF Pro Rounded","Nunito","Varela Round",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#ffd0e2;font-family:var(--font);color:var(--ink);overscroll-behavior:none;touch-action:none;position:fixed;inset:0;width:100%}
#app{position:fixed;inset:0;height:100dvh;overflow:hidden}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer}
button{font-family:inherit;border:0;cursor:pointer;touch-action:manipulation;color:inherit}
svg{display:block}

/* HUD */
#hud{position:absolute;left:0;right:0;top:0;padding:calc(10px + var(--safe-t)) calc(12px + var(--safe-r)) 0 calc(12px + var(--safe-l));display:flex;align-items:flex-start;gap:8px;pointer-events:none;z-index:5;transition:transform .4s cubic-bezier(.3,1.4,.5,1),opacity .3s}
#hud.hidden{transform:translateY(-130px);opacity:0}
#hud>*{pointer-events:auto}
.rbtn{width:58px;height:58px;border-radius:50%;background:linear-gradient(#fff,#ffe9f3);box-shadow:0 5px 0 #e9a9c6,0 8px 14px rgba(120,40,90,.25);display:grid;place-items:center;transition:transform .12s;flex:none}
.rbtn:active{transform:translateY(4px) scale(.96);box-shadow:0 1px 0 #e9a9c6,0 3px 8px rgba(120,40,90,.2)}
.rbtn svg{width:30px;height:30px}
.pill{height:46px;padding:0 16px 0 8px;border-radius:23px;background:rgba(255,255,255,.92);box-shadow:0 4px 0 rgba(200,140,180,.55),0 6px 12px rgba(120,40,90,.18);display:flex;align-items:center;gap:7px;font-weight:900;font-size:22px;margin-top:6px;flex:none}
.pill svg{width:30px;height:30px}
.pill.bump{animation:bump .4s}
@keyframes bump{40%{transform:scale(1.22)}}
.spacer{flex:1}
#combo{position:absolute;left:50%;top:calc(76px + var(--safe-t));transform:translateX(-50%);width:min(330px,70vw);height:34px;border-radius:17px;background:rgba(255,255,255,.55);box-shadow:inset 0 3px 6px rgba(120,40,90,.25),0 3px 0 rgba(255,255,255,.5);overflow:hidden;z-index:4;pointer-events:none;transition:opacity .3s}
#combo.hidden{opacity:0}
#comboFill{position:absolute;inset:3px;width:0;border-radius:14px;background:linear-gradient(90deg,#ff7ab8,#ffd23f);box-shadow:inset 0 3px 0 rgba(255,255,255,.5);transition:width .15s;max-width:calc(100% - 6px)}
#comboTxt{position:absolute;inset:0;display:grid;place-items:center;font-weight:900;font-size:17px;color:#fff;text-shadow:0 2px 0 rgba(160,40,100,.6),0 0 6px rgba(160,40,100,.5);letter-spacing:.5px}
#comboBox{position:absolute;left:50%;top:calc(76px + var(--safe-t));transform:translateX(-50%);z-index:4;pointer-events:none}
#comboBox.pop{animation:cpop .3s}
@keyframes cpop{40%{transform:translateX(-50%) scale(1.14)}}

/* shelf */
#shelfWrap{position:absolute;left:0;right:0;bottom:0;z-index:6;padding:0 0 var(--safe-b);transition:transform .45s cubic-bezier(.3,1.4,.5,1)}
#shelfWrap.hidden{transform:translateY(300px)}
#shelfBoard{position:absolute;left:0;right:0;bottom:0;top:38px;background:linear-gradient(#e7a96b,#c9824a 60%,#b46d38);box-shadow:0 -4px 0 #f3c590 inset,0 -10px 22px rgba(90,40,20,.25);border-radius:22px 22px 0 0}
#shelf{position:relative;display:flex;gap:10px;align-items:flex-end;overflow-x:auto;overflow-y:visible;padding:26px 14px 12px calc(14px + var(--safe-l));-webkit-overflow-scrolling:touch;scrollbar-width:none;touch-action:pan-x;height:134px}
#shelf::-webkit-scrollbar{display:none}
.tile{position:relative;flex:none;width:78px;height:88px;border-radius:22px;background:linear-gradient(#fff,#fff0d6);box-shadow:0 5px 0 #d9a15c,0 8px 10px rgba(80,30,10,.3);transition:transform .18s cubic-bezier(.3,1.6,.5,1);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0}
.tile canvas{width:62px;height:62px;pointer-events:none}
.tile .nm{font-size:11px;font-weight:900;color:var(--ink2);line-height:1;margin-top:1px;white-space:nowrap;pointer-events:none;letter-spacing:.2px}
.tile.sel{transform:translateY(-14px) scale(1.1);background:linear-gradient(#fff9c9,#ffe27a);box-shadow:0 5px 0 #e0a416,0 0 0 4px #fff,0 0 0 8px var(--pink),0 12px 18px rgba(80,30,10,.35)}
.tile:active{transform:translateY(2px) scale(.96)}
.tile.sel:active{transform:translateY(-10px) scale(1.05)}
.tile.locked canvas{filter:grayscale(.85) brightness(1.1);opacity:.55}
.tile.locked{background:linear-gradient(#f3ece0,#e2d6c2)}
.tile .price{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:3px;background:#fff;border-radius:11px;padding:1px 7px 1px 3px;font-size:13px;font-weight:900;box-shadow:0 2px 0 #d9a15c}
.tile .price svg{width:16px;height:16px}
.tile.afford{animation:wig 1.6s infinite}
@keyframes wig{0%,70%,100%{rotate:0deg}75%{rotate:-6deg}85%{rotate:6deg}92%{rotate:-3deg}}
.tile.shake{animation:shake .4s}
@keyframes shake{25%{translate:-7px 0}50%{translate:7px 0}75%{translate:-4px 0}}
.tile.shopTile{background:linear-gradient(#fff2fa,#ffc4e4);box-shadow:0 5px 0 #d85a9c,0 8px 10px rgba(80,30,10,.3)}
.tile.shopTile .nm{color:var(--pinkd)}
.tile .dot{position:absolute;top:-6px;right:-6px;min-width:26px;height:26px;border-radius:13px;background:var(--pink);color:#fff;font-size:14px;font-weight:900;display:grid;place-items:center;box-shadow:0 2px 0 var(--pinkd);border:2px solid #fff}
#hint{position:absolute;left:50%;top:200px;transform:translateX(-50%);z-index:7;background:#fff;border-radius:26px;padding:12px 22px;font-weight:900;font-size:21px;box-shadow:0 6px 0 #e2b8d2,0 12px 24px rgba(80,20,70,.28);pointer-events:none;text-align:center;white-space:nowrap;animation:hintb 1.1s infinite ease-in-out;transition:opacity .35s}
#hint:after{content:"";position:absolute;left:50%;bottom:-13px;margin-left:-14px;border:14px solid transparent;border-top-color:#fff;border-bottom:0}
#hint.hidden{opacity:0}
@keyframes hintb{50%{transform:translateX(-50%) translateY(-8px)}}

/* overlays */
.ov{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:calc(16px + var(--safe-t)) calc(16px + var(--safe-r)) calc(16px + var(--safe-b)) calc(16px + var(--safe-l))}
.ov.hidden{display:none}
.scrim{background:radial-gradient(circle at 50% 40%,rgba(120,50,140,.35),rgba(60,20,100,.62))}
.card{background:var(--card);border-radius:34px;padding:24px 24px 26px;box-shadow:0 10px 0 #e6c9e8,0 24px 50px rgba(50,10,80,.45);max-width:min(560px,100%);width:100%;text-align:center;animation:cardin .45s cubic-bezier(.3,1.5,.5,1);max-height:100%;overflow:auto}
@keyframes cardin{from{transform:scale(.6) translateY(40px);opacity:0}}
.card h2{margin:0 0 4px;font-size:36px;font-weight:900;color:var(--pinkd);letter-spacing:.3px}
.card p{margin:0 0 14px;font-size:18px;font-weight:800;color:var(--ink2)}
.big{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:64px;margin:10px 0 0;border-radius:32px;font-size:25px;font-weight:900;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.2);background:linear-gradient(#ff8fbe,#ff4f94);box-shadow:0 7px 0 #c42a70,0 12px 18px rgba(120,20,70,.3);transition:transform .1s;text-decoration:none}
.big:active{transform:translateY(5px);box-shadow:0 2px 0 #c42a70}
.big.blue{background:linear-gradient(#7ac8ff,#2f93ff);box-shadow:0 7px 0 #1a5fb8,0 12px 18px rgba(20,60,140,.3)}
.big.blue:active{box-shadow:0 2px 0 #1a5fb8}
.big.green{background:linear-gradient(#7aeaaa,#2fc678);box-shadow:0 7px 0 #1a8f50,0 12px 18px rgba(20,100,60,.3)}
.big.green:active{box-shadow:0 2px 0 #1a8f50}
.big.yellow{background:linear-gradient(#ffe27a,#ffb52e);box-shadow:0 7px 0 #c47d12,0 12px 18px rgba(140,90,10,.3);color:#7a3d00;text-shadow:0 2px 0 rgba(255,255,255,.4)}
.big.yellow:active{box-shadow:0 2px 0 #c47d12}
.big svg{width:30px;height:30px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row2 .big{font-size:21px;padding:0 8px}

/* title */
#title{z-index:15;flex-direction:column;justify-content:flex-start;padding-top:calc(5vh + var(--safe-t));background:linear-gradient(rgba(120,50,150,.25),rgba(255,200,230,0) 55%)}
#logo{display:flex;flex-direction:column;align-items:center;gap:0;pointer-events:none;margin-top:1vh}
#logo .l1,#logo .l2{display:flex;font-weight:900;line-height:.92;letter-spacing:1px}
#logo .l1{font-size:min(15vw,104px)} #logo .l2{font-size:min(11vw,76px);margin-top:2px}
#logo span{display:inline-block;color:var(--c);-webkit-text-stroke:0;text-shadow:0 5px 0 var(--d),0 9px 0 rgba(60,10,90,.35),0 0 0 #fff;paint-order:stroke fill;animation:lw 2.2s ease-in-out infinite;animation-delay:calc(var(--i)*.08s);filter:drop-shadow(0 0 0 #fff)}
@keyframes lw{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-10px) rotate(2deg)}}
#tag{margin-top:10px;font-size:min(4.6vw,22px);font-weight:900;color:#fff;text-shadow:0 2px 0 rgba(120,30,110,.7),0 0 10px rgba(120,30,110,.5);pointer-events:none}
#playBtn{width:min(300px,74vw);min-height:92px;font-size:42px;border-radius:46px;animation:pulse 1.3s infinite ease-in-out;margin:3vh 0 0}
#playBtn svg{width:44px;height:44px}
@keyframes pulse{50%{transform:scale(1.07)}}
#hub{position:absolute;left:calc(12px + var(--safe-l));top:calc(10px + var(--safe-t))}
#titleMute{position:absolute;right:calc(12px + var(--safe-r));top:calc(10px + var(--safe-t))}

/* shop */
#shop .card{max-width:min(760px,100%);padding:18px 18px 20px;display:flex;flex-direction:column;max-height:min(92dvh,760px)}
.shopHead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.shopHead h2{flex:1;text-align:left;font-size:32px;margin:0}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tab{flex:1;min-height:56px;border-radius:28px;background:#f0e3f5;font-size:19px;font-weight:900;color:var(--ink2);box-shadow:0 4px 0 #d5c1de;transition:transform .1s}
.tab.on{background:linear-gradient(#ff8fbe,#ff4f94);color:#fff;box-shadow:0 4px 0 #c42a70;text-shadow:0 2px 0 rgba(0,0,0,.2)}
.grid{overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:12px;padding:6px 4px 14px;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.sec{grid-column:1/-1;text-align:left;font-weight:900;font-size:17px;color:var(--ink2);margin-top:4px}
.item{position:relative;border-radius:24px;background:#fff;box-shadow:0 5px 0 #e3d3ea,0 8px 12px rgba(80,30,100,.12);padding:10px 8px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:164px;transition:transform .12s}
.item:active{transform:scale(.96)}
.item canvas{width:76px;height:76px}
.item .nm{font-size:15px;font-weight:900;line-height:1.1}
.item .st{margin-top:auto;min-height:36px;min-width:92px;border-radius:18px;font-size:16px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:4px;padding:0 10px;color:#fff;background:linear-gradient(#7aeaaa,#2fc678);box-shadow:0 3px 0 #1a8f50}
.item .st svg{width:18px;height:18px}
.item.buy .st{background:linear-gradient(#ffe27a,#ffb52e);box-shadow:0 3px 0 #c47d12;color:#7a3d00}
.item.cant .st{background:#e8dff0;box-shadow:0 3px 0 #cdbfd8;color:#8a7a9a}
.item.eq{outline:4px solid var(--green);outline-offset:-4px}
.item.eq .st{background:linear-gradient(#7ac8ff,#2f93ff);box-shadow:0 3px 0 #1a5fb8}
.item.shake{animation:shake .4s}
#toast{position:absolute;left:50%;top:calc(130px + var(--safe-t));transform:translate(-50%,-30px);z-index:40;background:#fff;border-radius:24px;padding:10px 22px;font-weight:900;font-size:20px;box-shadow:0 5px 0 #e2b8d2,0 10px 20px rgba(80,20,70,.3);opacity:0;pointer-events:none;transition:all .35s cubic-bezier(.3,1.5,.5,1);white-space:nowrap;max-width:94vw}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* done / levelup */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 6px}
.stat{background:#fff;border-radius:22px;padding:12px 4px;box-shadow:0 4px 0 #e3d3ea}
.stat b{display:block;font-size:34px;color:var(--pinkd)}
.stat span{font-size:14px;font-weight:800;color:var(--ink2)}
.bigstars{display:flex;justify-content:center;gap:8px;margin:8px 0}
.bigstars svg{width:68px;height:68px;animation:starin .6s cubic-bezier(.3,1.8,.5,1) both;animation-delay:calc(var(--i)*.18s)}
@keyframes starin{from{transform:scale(0) rotate(-120deg)}}
@media (max-width:560px){
  .tile{width:68px;height:82px}.tile canvas{width:54px;height:54px}.tile .nm{font-size:10px}
  #shelf{height:126px;gap:8px}
  .pill{font-size:19px;height:42px;padding-right:12px}.pill svg{width:26px;height:26px}
  .rbtn{width:56px;height:56px}
  #hint{font-size:17px;padding:10px 16px;white-space:normal;width:min(80vw,320px)}
  #combo{top:calc(72px + var(--safe-t))}
  .card h2{font-size:30px}
}
@media (max-height:520px){#shelf{height:100px}.tile{width:66px;height:76px}.tile canvas{width:48px;height:48px}.card{padding:14px}.big{min-height:52px;font-size:21px;margin-top:8px}}

/* v2 additions */
#hp{position:absolute;left:50%;top:calc(76px + var(--safe-t));transform:translateX(-50%);z-index:5;display:flex;align-items:center;gap:8px;width:min(360px,64vw);pointer-events:none;transition:opacity .3s}
#hp.hidden{opacity:0}
#hpHeart{width:34px;height:34px;flex:none;filter:drop-shadow(0 2px 0 rgba(0,0,0,.15))}
#hpBar{position:relative;flex:1;height:30px;border-radius:15px;background:rgba(255,255,255,.7);box-shadow:inset 0 3px 6px rgba(120,40,90,.3),0 3px 0 rgba(255,255,255,.5);overflow:hidden}
#hpFill{position:absolute;left:3px;top:3px;bottom:3px;width:100%;border-radius:12px;max-width:calc(100% - 6px);box-shadow:inset 0 3px 0 rgba(255,255,255,.5);transition:width .25s}
#hpTxt{position:absolute;inset:0;display:grid;place-items:center;font-weight:900;font-size:15px;color:#fff;text-shadow:0 2px 0 rgba(90,30,90,.7)}
#comboTag{position:absolute;right:-6px;top:34px;background:#ffb52e;color:#fff;font-weight:900;font-size:14px;border-radius:12px;padding:2px 10px;text-shadow:0 1px 0 rgba(120,60,0,.6);box-shadow:0 3px 0 #c47d12;animation:bump .3s}
#comboTag.hidden{display:none}
#tabs{position:relative;display:flex;gap:8px;padding:0 14px 0 calc(14px + var(--safe-l));overflow-x:auto;scrollbar-width:none;touch-action:pan-x;height:58px;align-items:flex-end}
#tabs::-webkit-scrollbar,#items::-webkit-scrollbar{display:none}
.ctab{flex:none;min-width:72px;height:56px;border-radius:18px 18px 8px 8px;background:linear-gradient(#f5dcb4,#e0b680);box-shadow:0 -3px 0 #f8e7c8 inset,0 3px 0 #a86d38;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:2px 8px 0;transition:transform .15s;color:#7a4a1f}
.ctab canvas{width:30px;height:30px;pointer-events:none}
.ctab span{font-size:11px;font-weight:900;line-height:1;pointer-events:none}
.ctab.on{background:linear-gradient(#fff,#ffeec9);color:var(--pinkd);transform:translateY(-4px);height:60px;box-shadow:0 3px 0 #a86d38,0 0 0 3px #fff}
#items{position:relative;display:flex;gap:10px;align-items:flex-end;overflow-x:auto;overflow-y:visible;padding:20px 14px 12px calc(14px + var(--safe-l));scrollbar-width:none;touch-action:pan-x;height:126px;-webkit-overflow-scrolling:touch}
#shelfBoard{top:52px !important}
#shelfWrap{padding-top:0}
#trash{position:absolute;right:calc(12px + var(--safe-r));bottom:calc(var(--shelfH,190px) + 10px);z-index:7;background:linear-gradient(#fff,#dbe8ff);box-shadow:0 5px 0 #a8bff0,0 8px 14px rgba(40,60,120,.25)}
#trash.armed{background:linear-gradient(#ffd0d6,#ff8a9a);box-shadow:0 5px 0 #c4384c;animation:wig .5s infinite}
#trash.hidden{display:none}
.rbtn.pulse{animation:pulse2 1.2s infinite}
@keyframes pulse2{50%{transform:scale(1.12)}}
.rbtn.hidden{display:none}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.tgl{min-height:56px;border-radius:28px;background:#e8dff0;font-weight:900;font-size:15px;color:#8a7a9a;box-shadow:0 4px 0 #cdbfd8;padding:0 6px}
.tgl.on{background:linear-gradient(#7aeaaa,#2fc678);color:#fff;box-shadow:0 4px 0 #1a8f50;text-shadow:0 1px 0 rgba(0,0,0,.2)}
#statRows{display:grid;gap:8px;margin:8px 0 6px}
.srow{display:flex;justify-content:space-between;background:#fff;border-radius:18px;padding:10px 16px;font-weight:800;font-size:18px;box-shadow:0 3px 0 #e3d3ea}
.srow b{color:var(--pinkd)}
#dayGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:10px 0}
.day{position:relative;background:#fff;border-radius:18px;padding:8px 2px;box-shadow:0 4px 0 #e3d3ea;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:900;color:var(--ink2)}
.day .dic{width:48px;height:48px}.day svg,.day canvas{width:48px;height:48px}
.day.today{outline:4px solid var(--yellow);animation:pulse2 1.2s infinite}
.day.done{opacity:.55}.day i{position:absolute;top:-8px;right:-4px;background:var(--green);color:#fff;border-radius:50%;width:24px;height:24px;display:grid;place-items:center;font-style:normal}
#koAmt{font-size:64px;font-weight:900;color:#2fa84f;text-shadow:0 4px 0 #bfeccb;margin:4px 0}
#koDbl.spin{animation:spinx .6s linear 2}
@keyframes spinx{to{transform:rotate(360deg)}}
#koDbl:disabled{opacity:.9}
.hidden{display:none}
#hud.hidden,#hp.hidden,#shelfWrap.hidden{display:flex}
#hp.hidden{display:flex;opacity:0}
#shelfWrap.hidden{display:block}
@media (max-width:560px){.nophone{display:none}.ctab{min-width:64px}.pill{padding-right:10px}#hp{top:calc(70px + var(--safe-t))}}
</style>
</head>
<body>
<div id="app">
  <canvas id="c"></canvas>

  <div id="hud" class="hidden">
    <button class="rbtn" id="pauseBtn" aria-label="Pause"><svg viewBox="0 0 32 32"><rect x="7" y="5" width="7" height="22" rx="3.5" fill="#ff4f94"/><rect x="18" y="5" width="7" height="22" rx="3.5" fill="#ff4f94"/></svg></button>
    <div class="pill" id="cashPill"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="14" fill="#58d68d" stroke="#1a8f50" stroke-width="2.5"/><circle cx="16" cy="16" r="9.5" fill="none" stroke="#a8f0c8" stroke-width="2"/><text x="16" y="21.5" text-anchor="middle" font-size="15" font-weight="900" fill="#fff" font-family="system-ui,sans-serif">$</text></svg><span id="cashN">0</span></div>
    <div class="pill" id="goldPill"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="14" fill="#ffd23f" stroke="#c47d12" stroke-width="2.5"/><path d="M16 7l2.6 5.6 6 .7-4.5 4.1 1.3 6L16 20.4 10.6 23.4l1.3-6-4.5-4.1 6-.7z" fill="#fff6c0" stroke="#e0a416" stroke-width="1.5" stroke-linejoin="round"/></svg><span id="goldN">0</span></div>
    <div class="spacer"></div>
    <button class="rbtn pulse hidden" id="giftBtn" aria-label="Daily gift"></button>
    <button class="rbtn" id="extrasBtn" aria-label="Extras"></button>
    <button class="rbtn nophone" id="muteBtn" aria-label="Sound"></button>
  </div>
  <div id="hp" class="hidden"><div id="hpHeart"></div><div id="hpBar"><div id="hpFill"></div><div id="hpTxt">Buddy</div></div><div id="comboTag" class="hidden"></div></div>

  <button class="rbtn hidden" id="trash" aria-label="Clear everything"></button>
  <div id="shelfWrap" class="hidden"><div id="shelfBoard"></div><div id="tabs"></div><div id="items"></div></div>
  <div id="hint" class="hidden"></div>
  <div id="toast"></div>

  <div id="title" class="ov">
    <a class="rbtn" id="hub" href="../" aria-label="Back to hub"><svg viewBox="0 0 32 32"><path d="M4 16L16 5l12 11" fill="none" stroke="#ff4f94" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 15v12h6v-7h4v7h6V15" fill="#ffc4e4" stroke="#ff4f94" stroke-width="3" stroke-linejoin="round"/></svg></a>
    <button class="rbtn" id="titleMute" aria-label="Sound"></button>
    <div id="logo"><div class="l1"></div><div class="l2"></div></div>
    <div id="tag">Squish, boing and giggle!</div>
    <button class="big" id="playBtn"><svg viewBox="0 0 32 32"><path d="M9 4.5v23l19-11.5z" fill="#fff" stroke="rgba(0,0,0,.15)" stroke-width="2" stroke-linejoin="round"/></svg>Play</button>
  </div>

  <div id="pause" class="ov scrim hidden"><div class="card">
    <h2>Paused</h2>
    <button class="big green" id="resumeBtn"><svg viewBox="0 0 32 32"><path d="M9 4.5v23l19-11.5z" fill="#fff"/></svg>Keep Playing</button>
    <div class="row2"><button class="big yellow" id="pDaily">Daily Gift</button><button class="big blue" id="pStats">Statistics</button></div>
    <div class="row3"><button class="tgl on" id="tMusic"><span>Music On</span></button><button class="tgl on" id="tSpeech"><span>Speech On</span></button><button class="tgl on" id="tVib"><span>Vibrate On</span></button></div>
    <div class="row2"><button class="big yellow" id="pReset">New Buddy</button><button class="big" id="pDone">I'm Done</button></div>
    <a class="big blue" id="pHome" href="../">Home</a>
  </div></div>

  <div id="extras" class="ov scrim hidden"><div class="card">
    <div class="shopHead"><h2>Extras</h2><div class="pill" id="exCash" style="margin:0"></div><button class="rbtn" id="exClose" aria-label="Close"><svg viewBox="0 0 32 32"><path d="M8 8l16 16M24 8L8 24" stroke="#ff4f94" stroke-width="4.5" stroke-linecap="round"/></svg></button></div>
    <div class="tabs"><button class="tab on" data-t="shirts">Shirts</button><button class="tab" data-t="looks">Looks</button><button class="tab" data-t="decor">Decor</button></div>
    <div class="grid" id="grid"></div>
  </div></div>

  <div id="stats" class="ov scrim hidden"><div class="card"><h2>Statistics</h2><div id="statRows"></div><button class="big blue" id="statsClose">Close</button></div></div>

  <div id="daily" class="ov scrim hidden"><div class="card"><h2>Daily Gifts</h2><p id="dailyMsg"></p><div id="dayGrid"></div><button class="big yellow" id="claimBtn">Collect Gift!</button><button class="big blue" id="dailyClose">Close</button></div></div>

  <div id="ko" class="ov scrim hidden"><div class="card"><h2>Buddy is knocked out!</h2><p id="koTxt">Bonus cash!</p><div id="koAmt">+100</div>
    <button class="big green" id="koOk">Collect</button><button class="big yellow" id="koDbl">Spin for x2!</button></div></div>

  <div id="done" class="ov scrim hidden"><div class="card">
    <h2>Great playing!</h2><p id="doneMsg">Buddy had so much fun!</p>
    <div class="bigstars" id="bigStars"></div>
    <div class="stats"><div class="stat"><b id="sHits">0</b><span>hits</span></div><div class="stat"><b id="sCombo">0</b><span>best combo</span></div><div class="stat"><b id="sCash">0</b><span>cash won</span></div></div>
    <button class="big green" id="againBtn">Play Again</button>
    <a class="big blue" href="../">Back to Games</a>
  </div></div>

  <div id="level" class="ov scrim hidden"><div class="card">
    <h2 id="lvTitle">Level 2!</h2><p id="lvMsg"></p>
    <div class="bigstars" id="lvStars"></div>
    <button class="big yellow" id="lvOk">Yay!</button>
  </div></div>
</div>
<script src="../../vendor/matter/matter.min.js"></script>
<script type="module" src="game.js"></script>
</body>
</html>
