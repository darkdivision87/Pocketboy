<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fox Dash">
<meta name="theme-color" content="#ff9a2a">
<title>Fox Dash</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<style>
:root{--o1:#ffc24a;--o2:#ff7a1c;--ink:#2a1650;--glass:rgba(34,20,78,.55);--pink:#ff5fa8;--cyan:#35e6ff;--gold:#ffd23f;
  --sat:env(safe-area-inset-top,0px);--sar:env(safe-area-inset-right,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);
  --u:min(1vw,1.6vh);}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#1a0f3a;overscroll-behavior:none;touch-action:none;
  font-family:ui-rounded,"SF Pro Rounded","Nunito","Varela Round",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:800;color:#fff}
body{position:fixed;inset:0;height:100dvh;width:100vw}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#fx{pointer-events:none}
svg{display:block}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
.screen{position:fixed;inset:0;display:none;padding:calc(var(--sat) + 16px) calc(var(--sar) + 20px) calc(var(--sab) + 16px) calc(var(--sal) + 20px);pointer-events:none}
.screen>*{pointer-events:auto}
body[data-s=title] #title,body[data-s=shop] #shop,body[data-s=pause] #pause,body[data-s=over] #over{display:flex}
#hud{position:fixed;inset:0;pointer-events:none;display:none;padding:calc(var(--sat) + 12px) calc(var(--sar) + 16px) calc(var(--sab) + 12px) calc(var(--sal) + 16px)}
body[data-s=play] #hud,body[data-s=pause] #hud{display:block}
.txt{text-shadow:0 3px 0 rgba(40,15,90,.55),0 0 18px rgba(40,15,90,.35)}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:64px;min-width:64px;padding:0 28px;border-radius:40px;font-size:calc(22px + .5vmin);letter-spacing:.3px;
  background:linear-gradient(#ffd45e,#ff9a2a 55%,#ff7a1c);box-shadow:0 7px 0 #b84a10,0 12px 22px rgba(30,0,60,.35),inset 0 2px 0 rgba(255,255,255,.55);text-shadow:0 2px 0 rgba(150,60,0,.55);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(5px);box-shadow:0 2px 0 #b84a10,0 4px 10px rgba(30,0,60,.35),inset 0 2px 0 rgba(255,255,255,.55)}
.btn.big{min-height:92px;padding:0 64px;font-size:calc(34px + 1vmin);border-radius:56px;box-shadow:0 9px 0 #b84a10,0 16px 28px rgba(30,0,60,.4),inset 0 3px 0 rgba(255,255,255,.6)}
.btn.big:active{transform:translateY(7px);box-shadow:0 2px 0 #b84a10,0 6px 12px rgba(30,0,60,.4),inset 0 3px 0 rgba(255,255,255,.6)}
.btn.alt{background:linear-gradient(#9d8bff,#6a4ff0 60%,#5538d8);box-shadow:0 7px 0 #2f1f92,0 12px 22px rgba(30,0,60,.35),inset 0 2px 0 rgba(255,255,255,.45);text-shadow:0 2px 0 rgba(30,10,120,.5)}
.btn.alt:active{box-shadow:0 2px 0 #2f1f92,0 4px 10px rgba(30,0,60,.35),inset 0 2px 0 rgba(255,255,255,.45)}
.btn.green{background:linear-gradient(#8cf08a,#33c24d 60%,#22a83c);box-shadow:0 7px 0 #146a26,0 12px 22px rgba(30,0,60,.35),inset 0 2px 0 rgba(255,255,255,.5);text-shadow:0 2px 0 rgba(10,90,30,.5)}
.btn.green:active{box-shadow:0 2px 0 #146a26,0 4px 10px rgba(30,0,60,.35)}
.btn[disabled]{filter:grayscale(.85) brightness(.8);pointer-events:none}
.btn.round{padding:0;width:68px;height:68px;border-radius:50%}
.btn svg{width:30px;height:30px;fill:currentColor;filter:drop-shadow(0 2px 0 rgba(0,0,0,.25))}
.btn.big svg{width:44px;height:44px}
a.btn{text-decoration:none;color:inherit}
.chip{display:inline-flex;align-items:center;gap:9px;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:30px;padding:9px 18px 9px 12px;font-size:calc(19px + .4vmin);box-shadow:inset 0 0 0 2px rgba(255,255,255,.18),0 6px 16px rgba(20,0,60,.25)}
.chip svg{width:30px;height:30px}
.panel{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:34px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.2),0 16px 40px rgba(20,0,60,.35)}
/* HUD */
#hud .chip,#hud .pu{backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(40,24,90,.62)}
#scoreBox{position:absolute;left:calc(var(--sal) + 18px);top:calc(var(--sat) + 12px)}
#score{font-size:calc(44px + 1.4vmin);line-height:1;font-variant-numeric:tabular-nums}
#scoreBox .sub{display:flex;gap:12px;margin-top:6px;font-size:calc(17px + .3vmin);opacity:.95}
#mult{background:linear-gradient(#ffd45e,#ff8a22);border-radius:14px;padding:2px 10px;text-shadow:0 2px 0 rgba(150,60,0,.5)}
#ringBox{position:absolute;left:50%;top:calc(var(--sat) + 12px);transform:translateX(-50%)}
#ringBox.pop{animation:pop .25s}
@keyframes pop{50%{transform:translateX(-50%) scale(1.22)}}
#btnPause{position:absolute;right:calc(var(--sar) + 16px);top:calc(var(--sat) + 12px);pointer-events:auto}
#pups{position:absolute;left:calc(var(--sal) + 18px);top:calc(var(--sat) + 100px + 1.4vmin);display:flex;flex-direction:column;gap:10px}
.pu{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;position:relative;background:var(--glass);box-shadow:inset 0 0 0 3px var(--c),0 6px 14px rgba(20,0,60,.3)}
.pu svg{width:36px;height:36px}
.pu i{position:absolute;inset:-2px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),transparent 0);-webkit-mask:radial-gradient(circle,transparent 27px,#000 28px);mask:radial-gradient(circle,transparent 27px,#000 28px)}
#btnDash{position:absolute;right:calc(var(--sar) + 22px);bottom:calc(var(--sab) + 26px);width:108px;height:108px;border-radius:50%;pointer-events:auto;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#5b4bd0,#2a1a78);box-shadow:0 8px 0 #160b50,0 14px 24px rgba(0,0,0,.35);opacity:.9;transition:transform .1s}
#btnDash svg.bolt{width:54px;height:54px;fill:#ffe14a;filter:drop-shadow(0 0 8px rgba(255,225,74,.7));z-index:1}
#btnDash svg.ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
#btnDash svg.ring circle{fill:none;stroke-width:9;stroke-linecap:round}
#btnDash.ready{opacity:1;animation:dashp .7s infinite alternate}
@keyframes dashp{to{transform:scale(1.12);box-shadow:0 8px 0 #160b50,0 0 36px 8px rgba(255,225,74,.65)}}
#btnDash:active{transform:scale(.92)}
#banner{position:absolute;left:0;right:0;top:26%;text-align:center;font-size:calc(40px + 3vmin);opacity:0;transform:scale(.7)}
#banner small{display:block;font-size:.42em;letter-spacing:3px;opacity:.9}
#banner.show{animation:ban 2.6s ease-out}
@keyframes ban{0%{opacity:0;transform:scale(.6)}12%{opacity:1;transform:scale(1.08)}22%{transform:scale(1)}78%{opacity:1}100%{opacity:0;transform:scale(1.04) translateY(-20px)}}
#toasts{position:absolute;left:50%;top:calc(var(--sat) + 100px);transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px}
.toast{display:flex;align-items:center;gap:12px;padding:12px 24px 12px 14px;background:linear-gradient(#7a5cff,#4a30c8);border-radius:36px;font-size:calc(19px + .4vmin);box-shadow:0 8px 20px rgba(0,0,0,.35),inset 0 0 0 2px rgba(255,255,255,.3);animation:toast 3.2s ease-out forwards}
.toast svg{width:34px;height:34px;animation:spin 1s ease-out}
@keyframes toast{0%{opacity:0;transform:translateY(-30px) scale(.8)}10%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
@keyframes spin{from{transform:rotate(-240deg) scale(.2)}}
#tut{position:absolute;left:50%;top:calc(var(--sat) + 17%);transform:translateX(-50%);display:flex;gap:22px;opacity:0;transition:opacity .5s;pointer-events:none}
#tut.on{opacity:1}
#tut{gap:min(22px,2.5vw)}#tut div{width:min(calc(78px + 3vmin),20vw);text-align:center;font-size:calc(16px + .3vmin)}
#tut .ic{width:min(calc(78px + 3vmin),20vw);height:min(calc(78px + 3vmin),20vw);border-radius:26px;background:var(--glass);display:grid;place-items:center;margin-bottom:6px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
#tut svg{width:54%;height:54%;fill:none;stroke:#fff;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
#tut .l svg{animation:swl 1.1s infinite}#tut .r svg{animation:swr 1.1s infinite}#tut .u svg{animation:swu 1.1s infinite}#tut .d svg{animation:swd 1.1s infinite}
@keyframes swl{50%{transform:translateX(-9px)}}@keyframes swr{50%{transform:translateX(9px)}}@keyframes swu{50%{transform:translateY(-9px)}}@keyframes swd{50%{transform:translateY(9px)}}
#flash{position:fixed;inset:0;pointer-events:none;opacity:0;background:radial-gradient(circle,rgba(255,60,60,0) 35%,rgba(255,40,70,.75));transition:opacity .35s}
#flash.on{opacity:1;transition:none}
/* title */
#title{flex-direction:column;justify-content:space-between;align-items:flex-start}
.tt-stats{align-self:flex-end;display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.tt-main{display:flex;flex-direction:column;gap:2.2vmin;align-items:flex-start;max-width:min(480px,92vw)}.lw,.aw{display:flex;flex-direction:column;gap:2.2vmin;align-items:inherit}
.logo{margin:0;line-height:.86;font-size:calc(72px + 9vmin);font-style:italic;font-weight:900;letter-spacing:-2px;transform:rotate(-4deg);transform-origin:left bottom;filter:drop-shadow(0 6px 0 rgba(70,20,110,.6)) drop-shadow(0 0 22px rgba(255,150,60,.5))}
.logo span{display:block;background:linear-gradient(#fff6c8 10%,#ffc24a 45%,#ff7a1c 85%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:calc(3px + .3vmin) #5a1f86;paint-order:stroke fill}
.logo span+span{margin-left:.35em;background:linear-gradient(#e9fbff 10%,#5ae0ff 50%,#3a7bff 88%);-webkit-background-clip:text;background-clip:text}
.tag{font-size:calc(17px + .4vmin);opacity:.95;margin:-.4vmin 0 .6vmin .4vmin}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.miss{padding:14px 18px;display:flex;flex-direction:column;gap:10px;width:min(440px,92vw)}
.miss h3{margin:0;font-size:calc(18px + .3vmin);display:flex;justify-content:space-between;align-items:center}
.m{display:grid;grid-template-columns:1fr auto;gap:2px 12px;font-size:calc(15px + .3vmin)}
.m .bar{grid-column:1/3;height:12px;border-radius:8px;background:rgba(0,0,0,.35);overflow:hidden}
.m .bar b{display:block;height:100%;background:linear-gradient(90deg,#ffd23f,#ff9a2a);border-radius:8px}
@media (orientation:portrait){#title{align-items:center}.tt-main{align-items:center;text-align:center;flex:1;width:100%;justify-content:space-between;max-width:none}.lw,.aw{align-items:center}.lw{margin-top:5vh}.logo{transform-origin:center;text-align:center}.row{justify-content:center}.tag{margin-left:0}}
/* shop */
#shop{align-items:stretch;justify-content:flex-end}
.shop{width:min(560px,100%,60vw);max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:14px;padding:18px}
.shop h2{margin:0;font-size:calc(28px + .8vmin);display:flex;justify-content:space-between;align-items:center}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.card{position:relative;aspect-ratio:1/1.05;border-radius:24px;background:rgba(255,255,255,.12);box-shadow:inset 0 0 0 3px rgba(255,255,255,.18);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:6px 4px 8px;font-size:calc(14px + .3vmin);transition:transform .12s}
.card svg{width:62%;aspect-ratio:1;margin-bottom:auto;margin-top:4px;filter:drop-shadow(0 4px 0 rgba(0,0,0,.2))}
.card:active{transform:scale(.94)}
.card.sel{background:rgba(255,194,74,.28);box-shadow:inset 0 0 0 4px #ffd23f,0 0 22px rgba(255,210,60,.5)}
.card .pr{display:flex;align-items:center;gap:4px;font-size:.95em}.card .pr svg{width:20px;height:20px;margin:0;filter:none}
.card .lk{position:absolute;right:8px;top:8px;width:22px;height:22px;opacity:.9}
.card.locked svg:first-child{filter:grayscale(.5) brightness(.7)}
.shop .row{justify-content:space-between}
@media (orientation:portrait){#shop{justify-content:flex-end;align-items:center}.shop{width:100%;max-height:62%}.grid{grid-template-columns:repeat(4,1fr)}}
/* pause / over */
#pause{align-items:center;justify-content:center;background:rgba(20,8,50,.5);pointer-events:auto}
.menu{display:flex;flex-direction:column;gap:16px;padding:28px 34px;align-items:stretch;min-width:min(380px,88vw)}
.menu h2{margin:0 0 4px;text-align:center;font-size:calc(34px + .8vmin)}
#over{align-items:center;justify-content:flex-start}
.over{padding:24px 30px;display:flex;flex-direction:column;gap:14px;align-items:center;width:min(500px,100%);text-align:center}
.over h2{margin:0;font-size:calc(38px + 1vmin);line-height:1}
.over .big{font-size:calc(64px + 2vmin);line-height:1;font-variant-numeric:tabular-nums}
.over .best{font-size:calc(18px + .3vmin);opacity:.95}
.over .best.new{color:#ffe14a;animation:pop2 .6s infinite alternate}
@keyframes pop2{to{transform:scale(1.12)}}
.stats{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
@media (orientation:portrait){#over{justify-content:center}}
@media (orientation:portrait) and (max-height:920px){.miss{display:none}}
@media (max-height:520px){.card{aspect-ratio:auto;height:84px;font-size:13px}.card svg{width:44%}.shop{padding:12px;gap:8px}.shop h2{font-size:22px}.grid{gap:8px}.over{padding:14px 20px;gap:8px}.over .big{font-size:48px}.btn.big{min-height:70px}.menu{gap:10px;padding:16px 26px}.btn{min-height:56px}.logo{font-size:64px}.btn.big{min-height:78px}.miss{display:none}}
</style>
</head>
<body data-s="title">
<canvas id="gl"></canvas>
<canvas id="fx"></canvas>
<div id="flash"></div>

<div id="hud">
  <div id="scoreBox" class="txt"><div id="score">0</div><div class="sub"><span id="mult">x1.0</span><span id="distv">0 m</span></div></div>
  <div id="ringBox" class="chip"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="10" fill="none" stroke="#ff9a00" stroke-width="7"/><circle cx="16" cy="16" r="10" fill="none" stroke="#ffd23f" stroke-width="4"/></svg><span id="rings" class="txt">0</span></div>
  <button id="btnPause" class="btn round alt" aria-label="Pause"><svg viewBox="0 0 24 24"><rect x="5" y="4" width="5" height="16" rx="2"/><rect x="14" y="4" width="5" height="16" rx="2"/></svg></button>
  <div id="pups"></div>
  <button id="btnDash" aria-label="Spin dash"><svg class="ring" viewBox="0 0 108 108"><circle cx="54" cy="54" r="48" stroke="rgba(255,255,255,.18)"/><circle id="dashArc" cx="54" cy="54" r="48" stroke="#ffe14a" stroke-dasharray="0 302"/></svg><svg class="bolt" viewBox="0 0 24 24"><path d="M13.5 1 4 13.5h6L8.5 23 20 9.5h-6.5z"/></svg></button>
  <div id="banner" class="txt"></div>
  <div id="toasts"></div>
  <div id="tut" class="txt">
    <div class="l"><div class="ic"><svg viewBox="0 0 48 48"><path d="M36 24H12M22 14 12 24l10 10"/></svg></div>Left</div>
    <div class="r"><div class="ic"><svg viewBox="0 0 48 48"><path d="M12 24h24M26 14l10 10-10 10"/></svg></div>Right</div>
    <div class="u"><div class="ic"><svg viewBox="0 0 48 48"><path d="M24 36V12M14 22l10-10 10 10"/></svg></div>Jump</div>
    <div class="d"><div class="ic"><svg viewBox="0 0 48 48"><path d="M24 12v24M14 26l10 10 10-10"/></svg></div>Roll</div>
  </div>
</div>

<section id="title" class="screen">
  <div class="tt-stats">
    <div class="chip txt" title="Best score"><svg viewBox="0 0 32 32"><path d="M16 3l4 8.5 9 1.2-6.6 6.4 1.7 9.1L16 23.800 7.900 28.200l1.700-9.100L3 12.700l9-1.200z" fill="#ffd23f"/></svg><span id="tBest">0</span></div>
    <div class="chip txt"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="10" fill="none" stroke="#ff9a00" stroke-width="7"/><circle cx="16" cy="16" r="10" fill="none" stroke="#ffd23f" stroke-width="4"/></svg><span id="tRings">0</span></div>
  </div>
  <div class="tt-main">
    <div class="lw"><h1 class="logo"><span>FOX</span><span>DASH</span></h1>
    <div class="tag txt">Outrun the robot! Swipe to dash, jump and roll.</div></div>
    <div class="aw"><button id="btnPlay" class="btn big"><svg viewBox="0 0 24 24"><path d="M7 4.500v15l13-7.500z"/></svg>PLAY</button>
    <div class="row">
      <button id="btnSkins" class="btn alt"><svg viewBox="0 0 24 24"><path d="M3 3l6 4h6l6-4v9a9 9 0 0 1-18 0z"/></svg>Foxes</button>
      <button id="btnMute" class="btn round alt" aria-label="Music"></button>
      <a id="btnHome" class="btn round alt" href="../" aria-label="Home"><svg viewBox="0 0 24 24"><path d="M12 3 2 12h3v9h5v-6h4v6h5v-9h3z"/></svg></a>
    </div>
    <div class="panel miss"><h3 class="txt"><span>Missions</span><span id="tStars" style="display:flex;align-items:center;gap:6px"></span></h3><div id="missList" style="display:flex;flex-direction:column;gap:10px"></div></div></div>
  </div>
</section>

<section id="shop" class="screen">
  <div class="panel shop">
    <h2 class="txt"><span>Choose your fox</span><span class="chip" style="font-size:20px"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="10" fill="none" stroke="#ff9a00" stroke-width="7"/><circle cx="16" cy="16" r="10" fill="none" stroke="#ffd23f" stroke-width="4"/></svg><span id="sRings">0</span></span></h2>
    <div id="skinGrid" class="grid"></div>
    <div class="row"><button id="btnShopBack" class="btn alt">Back</button><button id="btnBuy" class="btn green">Select</button></div>
  </div>
</section>

<section id="pause" class="screen">
  <div class="panel menu">
    <h2 class="txt">Paused</h2>
    <button id="btnResume" class="btn big" style="padding:0 40px;min-height:78px"><svg viewBox="0 0 24 24"><path d="M7 4.500v15l13-7.500z"/></svg>Resume</button>
    <button id="btnRestart" class="btn alt"><svg viewBox="0 0 24 24"><path d="M12 5V2L7 6.500 12 11V8a5 5 0 1 1-5 5H5a7 7 0 1 0 7-8z"/></svg>Restart</button>
    <button id="btnMute2" class="btn alt"></button>
    <a class="btn alt" href="../"><svg viewBox="0 0 24 24"><path d="M12 3 2 12h3v9h5v-6h4v6h5v-9h3z"/></svg>Home</a>
    <button id="btnQuit" class="btn alt" style="min-height:54px;font-size:20px">Quit to title</button>
  </div>
</section>

<section id="over" class="screen">
  <div class="panel over">
    <h2 class="txt" id="oTitle">Oh no!</h2>
    <div class="big txt" id="oScore">0</div>
    <div class="best txt" id="oBest">Best 0</div>
    <div class="stats">
      <div class="chip txt"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="10" fill="none" stroke="#ff9a00" stroke-width="7"/><circle cx="16" cy="16" r="10" fill="none" stroke="#ffd23f" stroke-width="4"/></svg><span id="oRings">0</span></div>
      <div class="chip txt"><svg viewBox="0 0 32 32"><path d="M4 22l8-12 5 7 3-4 8 9z" fill="#7be08a"/></svg><span id="oDist">0 m</span></div>
      <div class="chip txt" id="oStarsChip"><svg viewBox="0 0 32 32"><path d="M16 3l4 8.5 9 1.2-6.6 6.4 1.7 9.1L16 23.800 7.900 28.200l1.700-9.100L3 12.700l9-1.200z" fill="#ffd23f"/></svg><span id="oStars">0</span></div>
    </div>
    <button id="btnAgain" class="btn big" style="padding:0 48px"><svg viewBox="0 0 24 24"><path d="M12 5V2L7 6.500 12 11V8a5 5 0 1 1-5 5H5a7 7 0 1 0 7-8z"/></svg>Again!</button>
    <div class="row" style="justify-content:center"><button id="btnOSkins" class="btn alt"><svg viewBox="0 0 24 24"><path d="M3 3l6 4h6l6-4v9a9 9 0 0 1-18 0z"/></svg>Foxes</button><button id="btnOTitle" class="btn alt"><svg viewBox="0 0 24 24"><path d="M12 3 2 12h3v9h5v-6h4v6h5v-9h3z"/></svg>Menu</button></div>
  </div>
</section>
